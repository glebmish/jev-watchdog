name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every uv command fails instead of silently re-resolving when uv.lock is stale.
  UV_LOCKED: "1"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # 3.14 only: the code uses PEP 758 `except A, B:` syntax.
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        if: runner.os == 'Linux'
        run: uv run ruff check

      - name: Check formatting
        if: runner.os == 'Linux'
        run: uv run ruff format --check

      # addopts deselects the `live` tests, which need API keys and logins; never pass -m live here.
      - name: Test
        run: uv run pytest -q

      - name: Build sdist and wheel
        if: runner.os == 'Linux'
        run: uv build
