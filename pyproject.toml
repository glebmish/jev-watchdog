[project]
name = "jev-watchdog"
version = "0.1.0"
description = "Watchdog that judges Claude Code agent threads with Jev on every hook event and quarantines them on accumulated evidence."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gleb Mishchenko" }]
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.13",
    "claude-agent-sdk>=0.2.157",
    "rich>=14",
    "textual>=8",
    "textual-plotext>=1",
    "typesafe-sdk>=0.7.0",
]

[project.scripts]
jev-watchdog = "jev_watchdog.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-aiohttp>=1.1",
    "pytest-asyncio>=1.0",
    "ruff>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_watchdog"]

# An allowlist: without it the sdist takes every file the repo's .gitignore does not name.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    "/plugin",
    "/packs",
    "/pack.toml",
    "/uv.lock",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: calls the real Jev API (needs a key); run with -m live"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Console timestamps and run-log names are deliberately local wall-clock time.
ignore = ["DTZ"]
